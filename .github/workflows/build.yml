yaml
name: Build PulseX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload PulseX JAR
        uses: actions/upload-artifact@v4
        with:
          name: PulseX-1.21.11
          path: build/libs/pulsex-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
